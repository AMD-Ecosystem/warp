#
# Fast security scans for pull requests. Findings are published as a job
# summary and workflow artifact so forked pull requests use the same policy.

name: Security scan (PR)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  security:
    name: Security scan
    permissions:
      actions: read
      contents: read
      pull-requests: write
    uses: ROCm/rocm-security-gh/.github/workflows/security-baseline.yml@f92f9387d10fe91a0293762bdcefd3ba012a827b # v1.0.7
    with:
      report_formats: human
      bandit_config_path: .github/scan_tools_configs/bandit.yml
      gitleaks_config_path: .github/scan_tools_configs/gitleaks.toml
      trivy_config_path: .github/scan_tools_configs/trivy.yml
      zizmor_config_path: .github/scan_tools_configs/zizmor.yml
